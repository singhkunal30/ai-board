name: Mobile APK

# Builds a debug Android APK for AI-Board mobile and uploads it as an artifact.
# Run manually (Actions → Mobile APK → Run workflow) or on changes to apps/mobile.
on:
  workflow_dispatch:
    inputs:
      apiUrl:
        description: "Backend URL the app should talk to (LAN IP or https URL)"
        required: false
        default: "http://10.0.2.2:4000"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Bake the chosen backend URL into the build (defaults to emulator host).
      - name: Set default API URL
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));j.expo.extra=j.expo.extra||{};j.expo.extra.defaultApiUrl=process.env.API_URL;fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('defaultApiUrl =',process.env.API_URL)"
        env:
          API_URL: ${{ github.event.inputs.apiUrl || 'http://10.0.2.2:4000' }}

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-board-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
