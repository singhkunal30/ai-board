apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-board
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
# Note: MinIO and Ollama are not included here — point S3_* at your object
# store and AI_BASE_URL at your Ollama/vLLM deployment (Ollama benefits from a
# GPU node pool). See docs/deployment.md.
